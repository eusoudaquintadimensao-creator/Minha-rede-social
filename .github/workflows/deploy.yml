name: Deploy homem-cinza (Cloudflare Worker)
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: { group: deploy-cinza, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 209714ce3a62dabbf0c529c84541c686
    steps:
      - uses: actions/checkout@v4
      - name: Sem token, sem deploy
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::Adicione o segredo CLOUDFLARE_API_TOKEN (Settings > Secrets > Actions) para publicar automaticamente."
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with: { node-version: 22 }
      - name: Gerar o Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: python3 ferramentas/gerar-worker.py
      - name: Publicar
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 deploy
